[package]
name = "veyl"
version = "0.1.0"
description = "AIVPN — 用对话操作 VPN 的桌面客户端"
edition = "2021"
rust-version = "1.77"
# 多出一个 selftest bin 时，tauri dev 的 `cargo run` 需要这个才能选中主程序。
default-run = "veyl"

[lib]
name = "veyl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 只在本地/CI 的自测二进制里打开：保留旧的联网下载安装路径做回归。
# 发布构建不启用，避免出现绕过升级验签的旁路。
runtime-selftest = []

[[bin]]
name = "veyl-runtime-selftest"
path = "src/bin/runtime_selftest.rs"
required-features = ["runtime-selftest"]

# 特权 helper。必须显式声明：build-dmg.sh 靠解析这里来决定构建并装进包里，
# 只放在 src/bin/ 下自动发现是不够的（会漏掉 universal 构建，打包时直接失败）。
#
# Cargo 没有「按目标平台声明一个 bin」的语法（[[bin]] 不接受 target 条件）。
# 这里保留声明，Windows 构建靠 main.rs 的门控编译成空壳；真正依赖
# libxpc / Security.framework 的代码在 `#[cfg(target_os = "macos")] mod macos` 里，
# Windows 目标不会解析、也不会链接它们。
[[bin]]
name = "veyl-helper"
path = "src/bin/veyl-helper/main.rs"

# Windows 特权服务（LocalSystem + 命名管道）。macOS 上编译成空壳，
# 见 src/bin/veyl-service/main.rs 的门控。显式声明是为了打包脚本能按名字找到它。
[[bin]]
name = "veyl-service"
path = "src/bin/veyl-service/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
# macOS 构建额外开 asm（见下方 target 段）：build.rs 也要哈希 166MB 运行时。
[target.'cfg(target_os = "macos")'.build-dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
parking_lot = "0.12"
async-trait = "0.1"
anyhow = "1"
futures = "0.3"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }

# Claurst 以 crate 链接进主进程（git submodule，固定 commit，不修改源码）。
# 必须放在 [dependencies] 段内——放到后面任何 [target.'cfg(..)'.dependencies]
# 段之后，会变成平台专属依赖，macOS 上直接链接不到。
claurst-core = { path = "claurst/src-rust/crates/core" }
claurst-api = { path = "claurst/src-rust/crates/api" }
claurst-query = { path = "claurst/src-rust/crates/query" }
claurst-tools = { path = "claurst/src-rust/crates/tools" }

# 运行时与网络层（runtime / config / proxy）
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# 更新清单验签（Ed25519）与版本比较。ring 已在 rustls 依赖树里。
ring = "0.17"
semver = "1"
rand = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "http2",
    "json",
] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# TUN 提权：SMAppService 只在 macOS 13+ 存在，按需引入。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
# sha256 走硬件指令：aarch64 默认只有纯 Rust 实现（实测 166MB 慢 6 倍）；
# x86_64 默认已有 SHA-NI 派发。`asm` 依赖 sha2-asm（GAS 汇编，需要 cc），
# 所以在 Windows MSVC 上**不启用**——那边默认实现本来就够快，
# 而 sha2-asm 的 `.S` 在 MSVC 工具链下不可用。
sha2 = { version = "0.10", features = ["asm"] }
block2 = { version = "0.6", default-features = false }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSBundle",
    "alloc",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# TUN 特权服务用到的部分：SCM、命名管道、令牌/进程信息、Authenticode。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# 注意：release profile 不要设置 panic = "abort"。
# agent 的 run_query_loop 用 catch_unwind 隔离 panic，abort 会让整个应用退出。
[profile.release]
panic = "unwind"

# 只给 sha2 开优化，不全局改 dev：helper 在 `tun-dev.sh` 里是 debug 构建，
# 而 166MB 运行时的哈希在未优化时是 5.8s（优化后 0.29s，开 asm 后 0.05s）。
# 这会把每次 TUN 启动的等待从十几秒压到零点几秒，又不牺牲其余代码的可调试性。
[profile.dev.package.sha2]
opt-level = 3
