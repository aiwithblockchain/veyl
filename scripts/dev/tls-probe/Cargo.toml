[package]
name = "tls-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: do not join any parent workspace (the repo's Cargo.toml is not a
# workspace for this script, and claurst crates use workspace inheritance).
[workspace]

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1", "service"] }
# Pin the same rmcp / reqwest major that claurst resolves (see src-tauri/Cargo.lock).
rmcp = { version = "=1.8.0", default-features = false, features = [
    "client",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "reqwest-tls-no-provider",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "stream",
] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
