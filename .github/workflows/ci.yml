name: CI

# P1 只在 CI 里跑测试，不做发布；发布走本地 scripts/release/。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          # 必须 ≥22.22.2：jsdom 30 与 vitest 5 都声明了 Node 22+。
          # 用 26 是为了和开发机一致（见 .nvmrc 与 package.json 的 engines）。
          node-version: "26"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      # 前端单测（vitest + jsdom）。之前一直没接进来，CI 全绿但一条前端用例都没跑过。
      - name: Frontend tests
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # --lib 只编库，抓不到 bin 和集成测试。TUN 的 helper 是个 bin，它一度变成
      # 只能在 macOS 编译而没人发现——这条用 --all-targets 把 bin 也纳入编译。
      - name: Rust check all targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Contract checks
        shell: bash
        run: |
          if [ -f tests/contracts/check-contracts.mjs ]; then
            node tests/contracts/check-contracts.mjs
          else
            echo "契约检查脚本尚未落地，跳过"
          fi
