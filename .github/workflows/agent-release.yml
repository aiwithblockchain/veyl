name: agent release

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target
      - name: Tag must match agent/Cargo.toml
        run: |
          version="$(awk -F'"' '/^version = /{print $2; exit}' agent/Cargo.toml)"
          if [ "agent-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match agent/Cargo.toml version ${version}" >&2
            exit 1
          fi
      - name: Test the agent
        working-directory: agent
        run: cargo test --features dev

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 节点镜像固定为 ubuntu-24-04-x64：amd64 直接在同一个 OS 上原生构建，
          # 链接的 glibc 一定存在于目标机器。不走 musl，也不用 cross 容器
          # （它在 x86_64 runner 上的容器构建已经卡过两次）。
          - target: x86_64-unknown-linux-gnu
            asset: veyl-agent-linux-amd64
            os: ubuntu-24.04
          # arm64 还没有对应的固定镜像，保留静态 musl。
          - target: aarch64-unknown-linux-musl
            asset: veyl-agent-linux-arm64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent -> target
          key: ${{ matrix.target }}
      - name: Build amd64 (native, matches the node image)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: agent
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Install cross (arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked
      # agent/Cross.toml installs cmake/perl inside cross's target image.
      - name: Build arm64 (cross, static musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        working-directory: agent
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          cp "agent/target/${{ matrix.target }}/release/veyl-agent" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
      - name: Verify amd64 executes on the build OS
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          "./${{ matrix.asset }}" --help >/dev/null
          file "${{ matrix.asset }}"
      - name: Verify arm64 has no ELF interpreter
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          if readelf -l "${{ matrix.asset }}" | grep -q "INTERP"; then
            echo "error: ${{ matrix.asset }} is dynamically linked; it fails on hosts without a musl loader" >&2
            readelf -l "${{ matrix.asset }}" | grep -A1 INTERP >&2
            exit 1
          fi
          file "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build SHA256SUMS and release notes
        id: notes
        run: |
          cd dist
          sha256sum veyl-agent-linux-amd64 veyl-agent-linux-arm64 > SHA256SUMS
          echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
          echo "checksums<<EOF" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: agent ${{ steps.notes.outputs.version }}
          body: |
            veyl-agent ${{ steps.notes.outputs.version }}

            ```
            ${{ steps.notes.outputs.checksums }}
            ```
          files: |
            dist/veyl-agent-linux-amd64
            dist/veyl-agent-linux-arm64
            dist/SHA256SUMS
          fail_on_unmatched_files: true
