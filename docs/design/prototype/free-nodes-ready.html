<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veyl · 免费节点已就绪</title>
<style>
  :root {
    --canvas: #FAFAF8;
    --ink: #14161C;
    --ink-2: #5B5850;
    --ink-3: #6E6A62;
    --hair: rgba(20, 22, 28, 0.10);
    --accent: #F6537B;
    --accent-ink: #C2185B;
    --focus: #E03A66;
    --green: #1B7A4E;
    --red: #A8382D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font-family: inherit; }

  .shell {
    height: 100vh;
    display: grid;
    grid-template-columns: 56px 1fr 380px;
  }

  /* 最左导航竖条 */
  .nav {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 14px 0 16px;
  }

  .nav__item {
    position: relative;
    width: 56px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }

  .nav__item:hover { color: var(--ink); }

  .nav__item:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: -6px;
  }

  .nav__item.is-active { color: var(--ink); }

  .nav__item.is-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    width: 2px;
    height: 20px;
    border-radius: 1px;
    background: var(--focus);
  }

  .nav__foot {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .nav__account {
    width: 24px;
    height: 24px;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--hair);
    border-radius: 50%;
    background: #FFFFFF;
    color: var(--ink-3);
    cursor: pointer;
  }

  .nav__account:hover { color: var(--ink); }

  .nav__account:focus-visible,
  .nav__item:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: 2px;
  }

  /* 中间舞台 */
  .stage {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .col {
    width: 400px;
    max-width: 100%;
    animation: enter 160ms ease-out both;
  }

  @keyframes enter {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  /* 顶部状态带 */
  .band {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    border-bottom: 1px solid var(--hair);
    font-size: 13px;
    line-height: 1.4;
    color: var(--ink-2);
  }

  .band__dot {
    width: 6px;
    height: 6px;
    border-radius: 2px;
    background: var(--ink-3);
  }

  .band__dot.is-on { background: var(--green); }

  .band__timer {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }

  /* 节点卡 */
  .card {
    margin-top: 20px;
    border: 1px solid var(--hair);
    border-radius: 10px;
    background: #FFFFFF;
    overflow: hidden;
  }

  .card__head { padding: 18px 16px 14px; }

  .card__title {
    margin: 0;
    font-size: 20px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .card__sub {
    margin: 4px 0 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-3);
  }

  .node {
    position: relative;
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border: 0;
    border-top: 1px solid var(--hair);
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.35;
    text-align: left;
    cursor: pointer;
  }

  .node:hover { background: rgba(20, 22, 28, 0.03); }

  .node:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: -2px;
  }

  .node.is-selected {
    background: rgba(224, 58, 102, 0.06);
    font-weight: 500;
  }

  .node.is-selected::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--focus);
  }

  .node__ms {
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
  }

  /* 主按钮 */
  .primary {
    width: 100%;
    height: 48px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 0;
    border-radius: 10px;
    background: var(--ink);
    color: var(--canvas);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
  }

  .primary:hover:not(:disabled) { background: #24262E; }

  .primary:disabled {
    opacity: 1;
    cursor: default;
  }

  .primary:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: 3px;
  }

  .primary .dots { --dot-base: rgba(250, 250, 248, 0.55); }

  .dots {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .dots i {
    display: block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--dot-base, var(--ink-3));
    animation: dot-wave 900ms linear infinite;
  }

  .dots i:nth-child(1) { animation-delay: 0ms; }
  .dots i:nth-child(2) { animation-delay: 300ms; }
  .dots i:nth-child(3) { animation-delay: 600ms; }

  @keyframes dot-wave {
    0%, 33.333% {
      transform: scale(1.5);
      background-color: var(--accent);
    }
    33.334%, 100% {
      transform: scale(1);
      background-color: var(--dot-base, var(--ink-3));
    }
  }

  .note {
    margin: 12px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-3);
  }

  /* 右侧对话面板 */
  .chat {
    display: flex;
    flex-direction: column;
    border-left: 1px solid #E7E3DA;
  }

  .chat__head {
    flex: 0 0 auto;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px 0 20px;
  }

  .chat__label {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink-2);
  }

  .chat__collapse {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }

  .chat__collapse:hover { color: var(--ink); background: rgba(20, 22, 28, 0.05); }

  .chat__collapse:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: 2px;
  }

  .chat__body {
    flex: 1 1 auto;
    padding: 4px 20px;
    overflow: auto;
  }

  .chat__msg {
    margin: 0;
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink);
  }

  .chat__composer { flex: 0 0 auto; padding: 12px 20px 20px; }

  .chat__field {
    height: 44px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    border: 1px solid var(--hair);
    border-radius: 10px;
    background: #FFFFFF;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-3);
  }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0ms !important;
    }

    .col { opacity: 1; transform: none; }

    /* 静止时中间点保持高亮 */
    .dots i:nth-child(2) {
      width: 6px;
      height: 6px;
      background: var(--accent);
    }
  }
</style>
</head>
<body>

  <div class="shell">
    <nav class="nav" aria-label="主导航">
      <button class="nav__item is-active" type="button" aria-label="连接" aria-current="page" title="连接">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M8.2 11.8a3 3 0 0 0 4.24 0l2.4-2.4a3 3 0 0 0-4.24-4.24l-1 1"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          <path d="M11.8 8.2a3 3 0 0 0-4.24 0l-2.4 2.4a3 3 0 0 0 4.24 4.24l1-1"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </button>
      <button class="nav__item" type="button" aria-label="我的服务器" title="我的服务器">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="13" height="5.2" rx="1.4"
            stroke="currentColor" stroke-width="1.4" />
          <rect x="3.5" y="11.3" width="13" height="5.2" rx="1.4"
            stroke="currentColor" stroke-width="1.4" />
          <circle cx="6.4" cy="6.1" r="0.9" fill="currentColor" />
          <circle cx="6.4" cy="13.9" r="0.9" fill="currentColor" />
        </svg>
      </button>

      <div class="nav__foot">
        <button class="nav__account" type="button" aria-label="账户">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="5.6" r="2.4" stroke="currentColor" stroke-width="1.4" />
            <path d="M3.6 13.2a4.6 4.6 0 0 1 8.8 0"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
        <button class="nav__item nav__settings" type="button" aria-label="设置" title="设置">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.4" />
            <path d="M10 3.2v1.7M10 15.1v1.7M3.2 10h1.7M15.1 10h1.7M5.2 5.2l1.2 1.2M13.6 13.6l1.2 1.2M14.8 5.2l-1.2 1.2M6.4 13.6l-1.2 1.2"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </nav>

    <main class="stage">
      <section class="col" aria-label="免费节点">
        <div class="band">
          <span class="band__dot" id="band-dot" aria-hidden="true"></span>
          <span id="band-text">未连接</span>
          <span class="band__timer" id="band-timer" hidden>00:00:00</span>
        </div>

        <div class="card">
          <header class="card__head">
            <h1 class="card__title">免费节点</h1>
            <p class="card__sub">2 个节点 · 7 天试用</p>
          </header>
          <div role="listbox" aria-label="免费节点">
            <button class="node is-selected" type="button" role="option" aria-selected="true">
              东京 01
              <span class="node__ms">42ms</span>
            </button>
            <button class="node" type="button" role="option" aria-selected="false">
              新加坡 01
              <span class="node__ms">78ms</span>
            </button>
          </div>
        </div>

        <button class="primary" id="primary" type="button">连接</button>
        <p class="note">已加入 2 个免费节点，最快 42ms</p>
      </section>
    </main>

    <aside class="chat" aria-label="助手">
      <header class="chat__head">
        <span class="chat__label">助手</span>
        <button class="chat__collapse" type="button" aria-label="收起助手">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M5.5 3.5 9 7l-3.5 3.5" stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </header>
      <div class="chat__body">
        <p class="chat__msg">免费节点有 2 个，我测了速。</p>
      </div>
      <div class="chat__composer">
        <div class="chat__field" role="textbox" aria-disabled="true" tabindex="-1">
          告诉 Veyl 你要什么…
        </div>
      </div>
    </aside>
  </div>

<script>
  // simulated：连接与计时器都是原型内模拟，不发起真实请求。
  const primary = document.getElementById("primary");
  const bandDot = document.getElementById("band-dot");
  const bandText = document.getElementById("band-text");
  const bandTimer = document.getElementById("band-timer");
  const nodes = Array.from(document.querySelectorAll(".node"));

  const DOTS = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';
  let state = "idle"; // idle | connecting | connected
  let startedAt = 0;
  let tick = null;
  let connecting = null;

  function formatElapsed(ms) {
    const total = Math.floor(ms / 1000);
    const hh = String(Math.floor(total / 3600)).padStart(2, "0");
    const mm = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
    const ss = String(total % 60).padStart(2, "0");
    return hh + ":" + mm + ":" + ss;
  }

  function syncTimer() {
    bandTimer.textContent = formatElapsed(Date.now() - startedAt);
  }

  function selectNode(node) {
    nodes.forEach((item) => {
      const on = item === node;
      item.classList.toggle("is-selected", on);
      item.setAttribute("aria-selected", on ? "true" : "false");
    });
  }

  function connect() {
    if (state !== "idle") return;
    state = "connecting";
    startedAt = Date.now();
    primary.disabled = true;
    primary.setAttribute("aria-busy", "true");
    primary.innerHTML = DOTS + "<span>连接中</span>";

    // simulated：约 2 秒后视为连上。
    connecting = window.setTimeout(() => {
      state = "connected";
      bandDot.classList.add("is-on");
      bandText.textContent = "已连接";
      bandTimer.hidden = false;
      syncTimer();
      tick = window.setInterval(syncTimer, 250);
      primary.disabled = false;
      primary.removeAttribute("aria-busy");
      primary.textContent = "断开";
    }, 2000);
  }

  function disconnect() {
    state = "idle";
    window.clearTimeout(connecting);
    window.clearInterval(tick);
    connecting = null;
    tick = null;
    bandDot.classList.remove("is-on");
    bandText.textContent = "未连接";
    bandTimer.hidden = true;
    bandTimer.textContent = "00:00:00";
    primary.textContent = "连接";
  }

  primary.addEventListener("click", () => {
    if (state === "idle") connect();
    else if (state === "connected") disconnect();
  });

  nodes.forEach((node) => {
    node.addEventListener("click", () => selectNode(node));
  });
</script>
</body>
</html>
