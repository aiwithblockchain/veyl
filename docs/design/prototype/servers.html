<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veyl · 我的服务器</title>
<style>
  :root {
    --canvas: #FAFAF8;
    --ink: #14161C;
    --ink-2: #5B5850;
    --ink-3: #6E6A62;
    --hair: rgba(20, 22, 28, 0.10);
    --accent: #F6537B;
    --accent-ink: #C2185B;
    --focus: #E03A66;
    --green: #1B7A4E;
    --amber: #946200;
    --red: #A8382D;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button, input { font-family: inherit; }

  .app {
    height: 100vh;
    display: grid;
    grid-template-columns: 56px 280px 1fr 56px;
  }

  body.chat-open .app { grid-template-columns: 56px 280px 1fr 380px; }
  body.chat-open .ai-tab { display: none; }
  body:not(.chat-open) .chat { display: none; }

  /* 最左导航 */
  .nav {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 14px 0 16px;
  }

  .nav__item {
    position: relative;
    width: 56px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }

  .nav__item:hover { color: var(--ink); }

  .nav__item:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: -6px;
  }

  .nav__item.is-active { color: var(--ink); }

  .nav__item.is-active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    width: 2px;
    height: 20px;
    border-radius: 1px;
    background: var(--focus);
  }

  .nav__foot {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .nav__account {
    width: 24px;
    height: 24px;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--hair);
    border-radius: 50%;
    background: #FFFFFF;
    color: var(--ink-3);
    cursor: pointer;
  }

  .nav__account:hover { color: var(--ink); }

  .nav__account:focus-visible,
  .nav__item:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: 2px;
  }

  /* 服务器列表 */
  .list {
    min-width: 0;
    padding: 24px 0;
    border-right: 1px solid var(--hair);
    overflow-y: auto;
  }

  .list__item {
    width: 100%;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
  }

  .list__item:hover { background: rgba(20, 22, 28, 0.03); }

  .list__item:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: -2px;
  }

  .list__item.is-selected {
    background: #FFFFFF;
    position: relative;
  }

  .list__item.is-selected::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--focus);
  }

  .list__head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    flex: 0 0 auto;
    width: 6px;
    height: 6px;
    border-radius: 2px;
    background: var(--ink-3);
  }

  .dot--green { background: var(--green); }
  .dot--amber { background: var(--amber); }
  .dot--red { background: var(--red); }

  .list__name {
    flex: 1 1 auto;
    font-size: 15px;
    line-height: 1.35;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list__price {
    flex: 0 0 auto;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-3);
  }

  .list__status {
    padding-left: 14px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-3);
  }

  .list__status--green { color: var(--green); }
  .list__status--amber { color: var(--amber); }
  .list__status--red { color: var(--red); }

  /* 舞台 */
  .stage {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .col {
    width: 400px;
    max-width: 100%;
    animation: enter 160ms ease-out both;
  }

  @keyframes enter {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .title {
    margin: 0;
    font-size: 20px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .state {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    line-height: 1.4;
    color: var(--ink-2);
  }

  .facts {
    margin: 24px 0 0;
    border-top: 1px solid var(--hair);
  }

  .fact {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    border-bottom: 1px solid var(--hair);
  }

  .fact__label {
    font-size: 13px;
    line-height: 1.4;
    color: var(--ink-3);
  }

  .fact__value {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    text-align: right;
  }

  .fact__value--mono {
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  .primary {
    width: 100%;
    height: 48px;
    margin-top: 24px;
    border: 0;
    border-radius: 10px;
    background: var(--ink);
    color: var(--canvas);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
  }

  .primary:hover { background: #24262E; }

  .primary:focus-visible,
  .ghost:focus-visible,
  .danger-ghost:focus-visible,
  .btn-sm:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: 3px;
  }

  .danger-ghost {
    width: 100%;
    height: 44px;
    margin-top: 10px;
    border: 1px solid rgba(168, 56, 45, 0.35);
    border-radius: 10px;
    background: transparent;
    color: var(--red);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .danger-ghost:hover { border-color: rgba(168, 56, 45, 0.55); background: rgba(168, 56, 45, 0.04); }

  .ghost {
    height: 48px;
    padding: 0 20px;
    border: 1px solid var(--hair);
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }

  .ghost:hover { border-color: rgba(20, 22, 28, 0.22); }

  .row-buttons {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .row-buttons .primary { flex: 1 1 auto; margin-top: 0; }

  /* 销毁确认条 */
  .confirm-bar {
    margin-top: 12px;
    padding: 12px 14px;
    border: 1px solid var(--hair);
    border-radius: 10px;
    background: #FFFFFF;
  }

  .confirm-bar__text {
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-2);
  }

  .confirm-bar__actions {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .btn-sm {
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.4;
    font-weight: 500;
    cursor: pointer;
  }

  .btn-sm--ghost {
    border: 1px solid var(--hair);
    background: #FFFFFF;
    color: var(--ink);
  }

  .btn-sm--ghost:hover { border-color: rgba(20, 22, 28, 0.22); }

  .btn-sm--danger {
    border: 1px solid rgba(168, 56, 45, 0.35);
    background: transparent;
    color: var(--red);
  }

  .btn-sm--danger:hover { border-color: rgba(168, 56, 45, 0.55); background: rgba(168, 56, 45, 0.04); }

  /* 失败态 */
  .reason {
    margin: 12px 0 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-2);
  }

  /* 安装中 */
  .progress {
    margin-top: 24px;
    height: 6px;
    border-radius: 3px;
    background: #F1EFEA;
    overflow: hidden;
  }

  .progress__fill {
    height: 100%;
    border-radius: 3px;
    background: var(--ink);
  }

  .steps {
    margin: 16px 0 0;
    padding: 0;
    list-style: none;
  }

  .step {
    height: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    line-height: 1.4;
    color: var(--ink-3);
  }

  .step__mark {
    width: 14px;
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--hair);
    border-radius: 50%;
    font-size: 9px;
    line-height: 1;
  }

  .step.is-done { color: var(--ink-2); }

  .step.is-done .step__mark {
    border-color: var(--green);
    color: var(--green);
  }

  .step.is-done .step__mark::after { content: "✓"; }

  .step.is-current { color: var(--ink); }

  .step.is-current .step__mark {
    border-color: var(--amber);
    background: var(--amber);
  }

  .step__pct {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }

  /* 右侧助手 */
  .chat {
    display: flex;
    flex-direction: column;
    border-left: 1px solid #E7E3DA;
  }

  .chat__head {
    flex: 0 0 auto;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px 0 20px;
  }

  .chat__label {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink-2);
  }

  .chat__collapse {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }

  .chat__collapse:hover { color: var(--ink); background: rgba(20, 22, 28, 0.05); }

  .chat__collapse:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: 2px;
  }

  .chat__body {
    flex: 1 1 auto;
    padding: 4px 20px;
    overflow: auto;
  }

  .chat__msg {
    margin: 0;
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink);
  }

  .chat__composer { flex: 0 0 auto; padding: 12px 20px 20px; }

  .chat__field {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border: 1px solid var(--hair);
    border-radius: 10px;
    background: #FFFFFF;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    outline: none;
  }

  .chat__field::placeholder { color: var(--ink-3); }

  .chat__field:focus {
    border-color: var(--focus);
    box-shadow: 0 0 0 1px var(--focus);
  }

  .ai-tab {
    display: flex;
    align-items: center;
    justify-content: center;
    border-left: 1px solid var(--hair);
  }

  .ai-tab__btn {
    height: 100%;
    width: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
  }

  .ai-tab__btn:hover { color: var(--ink); }

  .ai-tab__btn:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: -6px;
  }

  .ai-tab__text {
    writing-mode: vertical-rl;
    font-size: 12px;
    line-height: 1;
    letter-spacing: 0.14em;
  }

  .text {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--accent-ink);
    font-size: 13px;
    line-height: 1.6;
    cursor: pointer;
  }

  .text:hover { color: #9C1249; }

  .text:focus-visible {
    outline: 1px solid var(--focus);
    outline-offset: 3px;
  }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition-duration: 0.01ms !important;
      transition-delay: 0ms !important;
    }

    .col { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <div class="app">
    <nav class="nav" aria-label="主导航">
      <button class="nav__item" type="button" aria-label="连接" title="连接">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M8.2 11.8a3 3 0 0 0 4.24 0l2.4-2.4a3 3 0 0 0-4.24-4.24l-1 1"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          <path d="M11.8 8.2a3 3 0 0 0-4.24 0l-2.4 2.4a3 3 0 0 0 4.24 4.24l1-1"
            stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </button>
      <button class="nav__item is-active" type="button" aria-label="我的服务器" aria-current="page" title="我的服务器">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="3.5" y="3.5" width="13" height="5.2" rx="1.4"
            stroke="currentColor" stroke-width="1.4" />
          <rect x="3.5" y="11.3" width="13" height="5.2" rx="1.4"
            stroke="currentColor" stroke-width="1.4" />
          <circle cx="6.4" cy="6.1" r="0.9" fill="currentColor" />
          <circle cx="6.4" cy="13.9" r="0.9" fill="currentColor" />
        </svg>
      </button>

      <div class="nav__foot">
        <button class="nav__account" type="button" aria-label="账户">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="5.6" r="2.4" stroke="currentColor" stroke-width="1.4" />
            <path d="M3.6 13.2a4.6 4.6 0 0 1 8.8 0"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
        <button class="nav__item" type="button" aria-label="设置" title="设置">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.4" />
            <path d="M10 3.2v1.7M10 15.1v1.7M3.2 10h1.7M15.1 10h1.7M5.2 5.2l1.2 1.2M13.6 13.6l1.2 1.2M14.8 5.2l-1.2 1.2M6.4 13.6l-1.2 1.2"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </nav>

    <div class="list" role="listbox" aria-label="我的服务器">
      <button class="list__item is-selected" type="button" role="option" aria-selected="true" data-server="sg">
        <span class="list__head">
          <span class="dot dot--green" aria-hidden="true"></span>
          <span class="list__name">新加坡 01</span>
          <span class="list__price">每天 $0.20</span>
        </span>
        <span class="list__status list__status--green">运行中</span>
      </button>

      <button class="list__item" type="button" role="option" aria-selected="false" data-server="fra">
        <span class="list__head">
          <span class="dot dot--amber" aria-hidden="true"></span>
          <span class="list__name">法兰克福 01</span>
          <span class="list__price">每天 $0.30</span>
        </span>
        <span class="list__status list__status--amber">安装中 62%</span>
      </button>

      <button class="list__item" type="button" role="option" aria-selected="false" data-server="ny">
        <span class="list__head">
          <span class="dot dot--red" aria-hidden="true"></span>
          <span class="list__name">纽约 01</span>
          <span class="list__price">每天 $0.30</span>
        </span>
        <span class="list__status list__status--red">创建失败</span>
      </button>
    </div>

    <main class="stage">
      <!-- 运行中 -->
      <section class="col" id="view-sg" aria-label="新加坡 01">
        <div class="title-row">
          <h1 class="title">新加坡 01</h1>
          <span class="state"><span class="dot dot--green" aria-hidden="true"></span>运行中</span>
        </div>

        <dl class="facts">
          <div class="fact">
            <dt class="fact__label">地区</dt>
            <dd class="fact__value">新加坡 1</dd>
          </div>
          <div class="fact">
            <dt class="fact__label">规格</dt>
            <dd class="fact__value">入门 · 1 核 · 512 MB</dd>
          </div>
          <div class="fact">
            <dt class="fact__label">IP</dt>
            <dd class="fact__value fact__value--mono">
              143.198.52.11
              <button class="text" id="copy-ip" type="button">复制</button>
            </dd>
          </div>
          <div class="fact">
            <dt class="fact__label">计费</dt>
            <dd class="fact__value">每天 $0.20 · 已付到 11 月 23 日</dd>
          </div>
        </dl>

        <button class="primary" type="button">连接</button>
        <button class="danger-ghost" id="destroy" type="button">销毁</button>

        <div class="confirm-bar" id="destroy-confirm" hidden>
          <p class="confirm-bar__text">销毁后不再产生新费用，当天已扣不退。</p>
          <div class="confirm-bar__actions">
            <button class="btn-sm btn-sm--ghost" id="destroy-cancel" type="button">取消</button>
            <button class="btn-sm btn-sm--danger" id="destroy-ok" type="button">确认销毁</button>
          </div>
        </div>
      </section>

      <!-- 安装中 -->
      <section class="col" id="view-fra" aria-label="法兰克福 01" hidden>
        <div class="title-row">
          <h1 class="title">法兰克福 01</h1>
          <span class="state"><span class="dot dot--amber" aria-hidden="true"></span>安装中 62%</span>
        </div>

        <div class="progress" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100">
          <div class="progress__fill" style="width:62%"></div>
        </div>

        <ol class="steps">
          <li class="step is-done"><span class="step__mark" aria-hidden="true"></span>开机</li>
          <li class="step is-current">
            <span class="step__mark" aria-hidden="true"></span>装环境
            <span class="step__pct">62%</span>
          </li>
          <li class="step"><span class="step__mark" aria-hidden="true"></span>生成节点</li>
          <li class="step"><span class="step__mark" aria-hidden="true"></span>测速</li>
        </ol>
      </section>

      <!-- 创建失败 -->
      <section class="col" id="view-ny" aria-label="纽约 01" hidden>
        <div class="title-row">
          <h1 class="title">纽约 01</h1>
          <span class="state"><span class="dot dot--red" aria-hidden="true"></span>创建失败</span>
        </div>

        <p class="reason">装环境超时，可重试。</p>

        <div class="row-buttons">
          <button class="primary" type="button">重建</button>
          <button class="ghost" id="ask-ai" type="button">AI 定位</button>
        </div>
      </section>
    </main>

    <aside class="chat" id="chat" aria-label="助手">
      <header class="chat__head">
        <span class="chat__label">助手</span>
        <button class="chat__collapse" id="chat-collapse" type="button" aria-label="收起助手">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M5.5 3.5 9 7l-3.5 3.5" stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </header>
      <div class="chat__body">
        <p class="chat__msg" id="chat-msg" hidden>我看下这次创建卡在哪一步。</p>
      </div>
      <div class="chat__composer">
        <input class="chat__field" type="text" autocomplete="off"
          placeholder="告诉 Veyl 你要什么…" aria-label="告诉 Veyl 你要什么" />
      </div>
    </aside>

    <aside class="ai-tab" id="ai-tab">
      <button class="ai-tab__btn" id="chat-expand" type="button" aria-label="展开助手">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4 5.6A1.6 1.6 0 0 1 5.6 4h8.8A1.6 1.6 0 0 1 16 5.6v6.8a1.6 1.6 0 0 1-1.6 1.6H9l-3.4 2.4v-2.4H5.6A1.6 1.6 0 0 1 4 12.4V5.6Z"
            stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
        </svg>
        <span class="ai-tab__text">助手</span>
      </button>
    </aside>
  </div>

<script>
  // simulated：原型只做界面，不接真实命令。
  const views = {
    sg: document.getElementById("view-sg"),
    fra: document.getElementById("view-fra"),
    ny: document.getElementById("view-ny"),
  };
  const items = Array.from(document.querySelectorAll(".list__item"));
  const destroyConfirm = document.getElementById("destroy-confirm");

  function selectServer(key) {
    Object.entries(views).forEach(([name, node]) => {
      node.hidden = name !== key;
    });
    items.forEach((item) => {
      const on = item.dataset.server === key;
      item.classList.toggle("is-selected", on);
      item.setAttribute("aria-selected", on ? "true" : "false");
    });
    destroyConfirm.hidden = true;
  }

  items.forEach((item) => {
    item.addEventListener("click", () => selectServer(item.dataset.server));
  });

  // 销毁：就地确认条
  document.getElementById("destroy").addEventListener("click", () => {
    destroyConfirm.hidden = false;
  });

  document.getElementById("destroy-cancel").addEventListener("click", () => {
    destroyConfirm.hidden = true;
  });

  document.getElementById("destroy-ok").addEventListener("click", () => {
    // simulated：原型不真销毁，只收起确认条。
    destroyConfirm.hidden = true;
  });

  // 助手面板：默认收起，点边缘 tab 或 AI 定位展开
  function openChat() {
    document.body.classList.add("chat-open");
  }

  document.getElementById("chat-expand").addEventListener("click", openChat);

  document.getElementById("chat-collapse").addEventListener("click", () => {
    document.body.classList.remove("chat-open");
  });

  document.getElementById("ask-ai").addEventListener("click", () => {
    openChat();
    document.getElementById("chat-msg").hidden = false;
  });

  // IP 复制
  const copyIp = document.getElementById("copy-ip");
  copyIp.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText("143.198.52.11");
    } catch {
      // simulated：剪贴板不可用时不给反馈。
    }
    copyIp.textContent = "已复制";
    window.setTimeout(() => { copyIp.textContent = "复制"; }, 1200);
  });
</script>
</body>
</html>
