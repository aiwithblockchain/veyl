[package]
name = "veyl-cli"
version = "0.1.0"
description = "Veyl 轻量客户端"
edition = "2021"
rust-version = "1.77"
default-run = "veyl-cli"

[lib]
name = "veyl_cli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 订阅拉取：关掉默认 TLS（会拉 native-tls/OpenSSL），与主客户端同一套 rustls。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "macros"] }
thiserror = "2"
rand = "0.8"
# 本地加密凭据文件（与主客户端 `secrets.enc` 同一套构造）。
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"

# 系统钥匙串：只在发布构建默认启用，debug 走本地加密文件（见 secrets.rs）。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
] }

[dev-dependencies]
tempfile = "3"
